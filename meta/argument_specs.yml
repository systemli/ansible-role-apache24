---
argument_specs:
  main:
    short_description: Install and configure the Apache 2.4 web server on Debian
    description:
      - Installs Apache, configures MPM, modules and global configs, and enables vhosts shipped in the playbook's C(files/apache2/sites-available) directory.
    options:
      apache24_packages:
        type: list
        elements: str
        description:
          - Packages to install.
      apache24_http_port:
        type: int
        description:
          - HTTP listen port.
      apache24_https_port:
        type: int
        description:
          - HTTPS listen port.
      apache24_additional_ports:
        type: list
        elements: str
        description:
          - Additional C(Listen) entries, either a port or C(ip:port).
      apache24_mutex_default:
        type: str
        description:
          - Value of the default C(Mutex) directive in apache2.conf.
      apache24_custom_modules:
        type: list
        elements: str
        description:
          - Module config files from the role's C(files/apache2/mods-available) to copy.
      apache24_modules:
        type: list
        elements: str
        description:
          - Apache modules to enable.
      apache24_modules_extra:
        type: list
        elements: str
        description:
          - Additional modules to enable (appended to C(apache24_modules)).
      apache24_disabled_modules:
        type: list
        elements: str
        description:
          - Modules to disable.
      apache24_configs:
        type: list
        elements: str
        description:
          - Additional config names (file names in C(conf-available)) to enable.
      apache24_vhosts:
        type: list
        elements: str
        description:
          - Names of vhost files (without C(.conf)) from C(files/apache2/sites-available) to install and enable.
      apache24_custom_configs:
        type: list
        elements: str
        description:
          - Config templates shipped with the role to install and enable.
      apache24_apache2_conf_error_log:
        type: str
        description:
          - ErrorLog directive in apache2.conf.
      apache24_other_vhosts_access_log_conf_custom_log:
        type: str
        description:
          - CustomLog directive in other-vhosts-access-log.conf.
      apache24_mpm:
        type: str
        choices: [event, prefork, worker]
        description:
          - Multi-processing module to use.
      apache24_mpm_startservers:
        type: int
      apache24_mpm_serverlimit:
        type: int
      apache24_mpm_minspareservers:
        type: int
      apache24_mpm_maxspareservers:
        type: int
      apache24_mpm_minsparethreads:
        type: int
      apache24_mpm_maxsparethreads:
        type: int
      apache24_mpm_threadlimit:
        type: int
      apache24_mpm_threadperchild:
        type: int
      apache24_mpm_max_clients:
        type: int
        description:
          - Not used by the role's templates, kept for compatibility.
      apache24_mpm_maxrequestworkers:
        type: int
        description:
          - Defaults to C(apache24_mpm_serverlimit * apache24_mpm_threadperchild).
      apache24_mpm_maxconnectionsperchild:
        type: int
      apache24_ssl_cipher_suite:
        type: str
        description:
          - SSLCipherSuite value.
